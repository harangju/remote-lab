site_name: Remote Lab Docs
site_url: https://harangju.github.io/remote-lab/
repo_url: https://github.com/harangju/remote-lab

nav:
  - Overview: index.md
  - Setup: setup.md
  - Usage: usage.md

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
