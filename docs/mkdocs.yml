site_name: Remote Lab Docs
site_url: https://harangju.github.io/remote-lab/
repo_url: https://github.com/harangju/remote-lab

docs_dir: .

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Guides:
      - Projects and Chat: guides/projects-and-chat.md
      - Files and Tools: guides/files-and-tools.md
      - Agents and Mentions: guides/agents-and-mentions.md
      - Self-Hacking: guides/self-hacking.md
      - Slides: guides/slides.md
  - Reference:
      - Deployment: reference/deployment.md
      - Architecture: reference/architecture.md
      - Operations: reference/operations.md

theme:
  name: shadcn
  show_title: true
  show_stargazers: false
  pygments_style:
    light: shadcn-light
    dark: github-dark
  topbar_sections: false

markdown_extensions:
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      pygments_lang_class: true
      css_class: codehilite
  - pymdownx.superfences
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css
  - stylesheets/pygments.css

extra_javascript:
  - https://unpkg.com/lucide@latest/dist/umd/lucide.min.js
  - javascripts/icons.js
